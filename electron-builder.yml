appId: com.chandlerbassett.depleted
productName: Depleted
# Based on WoW Arena Recorder (MIT) — keep the original copyright notice.
copyright: Copyright © 2024 Aleksandr Kravchenko; © 2026 Depleted contributors

# electron-vite outputs to out/; electron-builder picks it up from there.
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - "!**/*.map"

extraResources:
  - from: addon
    to: addon
  - from: resources/tray
    to: tray

afterSign: build/afterSign.js

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch:
        - universal   # fat binary: arm64 + x64 in one .app
  # The native capture helper (npm run build:native) → Contents/Resources/bin.
  # Added to the top-level extraResources (the addon), not replacing them.
  extraResources:
    - from: native/bin
      to: bin
      filter:
        - depleted-capture
  # The helper is already a fat binary, so it's identical in the x64 and arm64 halves
  # of a universal build; @electron/universal refuses to merge that unless told to.
  x64ArchFiles: Contents/Resources/bin/depleted-capture
  minimumSystemVersion: "13.0"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: false
  gatekeeperAssess: false
  # null = ad-hoc signing (local dev builds, no Developer ID required).
  # For notarised public distribution, remove this line and set
  # CSC_LINK / CSC_KEY_PASSWORD or use the Xcode keychain.
  identity: null
  extendInfo:
    # Required since macOS 10.15 for any app that captures the screen.
    NSScreenCaptureUsageDescription: >-
      Depleted captures the WoW window to record Mythic+ keys.
      This permission is used only while a key or match is in progress.

# App icon: build/icon.icns (mac) and build/icon.png (other platforms), picked up from
# buildResources by default.
dmg:
  title: "${productName} ${version}"
  background: build/background.png   # background@2x.png next to it is used on Retina
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
win:
  target:
    - target: nsis
      arch:
        - x64
  publisherName: Aleksandr Kravchenko

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
