appId: com.chandlerbassett.depleted
productName: Depleted
# Forked from wowArenaAnalyzer (MIT): keep the original copyright notice.
copyright: Copyright © 2024 Aleksandr Kravchenko; © 2026 Chandler Bassett

# electron-vite outputs to out/; electron-builder picks it up from there.
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - "!**/*.map"

extraResources:
  - from: addon
    to: addon
  - from: resources/tray
    to: tray

afterSign: build/afterSign.js

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch:
        - arm64   # Apple silicon only; Intel Macs aren't supported
  # The native capture helper (npm run build:native) → Contents/Resources/bin.
  # Added to the top-level extraResources (the addon), not replacing them.
  extraResources:
    - from: native/bin
      to: bin
      filter:
        - depleted-capture
  minimumSystemVersion: "13.0"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: false
  gatekeeperAssess: false
  # null = no Developer ID. build/afterSign.js then signs with the stable local
  # certificate from scripts/create-signing-cert.sh if it exists (so Screen Recording
  # permission survives rebuilds), else ad-hoc. For notarised public distribution,
  # remove this line and set CSC_LINK / CSC_KEY_PASSWORD or use the Xcode keychain.
  identity: null
  extendInfo:
    # Required since macOS 10.15 for any app that captures the screen.
    NSScreenCaptureUsageDescription: >-
      Depleted captures the game window to record your Mythic+ keys.
      It only records in Mythic dungeons, or when you run a test recording.

# App icon: build/icon.icns, picked up from buildResources by default.
dmg:
  title: "${productName} ${version}"
  background: build/background.png   # background@2x.png next to it is used on Retina
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 170
    - x: 410
      y: 170
      type: link
      path: /Applications
