appId: com.chandlerbassett.depleted
productName: Depleted
# Forked from wowArenaAnalyzer (MIT): keep the original copyright notice.
copyright: Copyright © 2024 Aleksandr Kravchenko; © 2026 Chandler Bassett

# electron-vite outputs to out/; electron-builder picks it up from there.
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - "!**/*.map"

extraResources:
  - from: addon
    to: addon
  - from: resources/tray
    to: tray

afterPack: build/afterPack.js
afterSign: build/afterSign.js

# The auto-updater (src/main/updater.ts) reads latest-mac.yml from the latest GitHub
# release. The release workflow uploads the files itself (--publish never), so this only
# writes app-update.yml into the app and latest-mac.yml next to the build.
publish:
  provider: github
  owner: chandlerbassett
  repo: Depleted
  releaseType: release

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch:
        - arm64   # Apple silicon only; Intel Macs aren't supported
    # Squirrel.Mac installs updates from the zip, not the DMG
    - target: zip
      arch:
        - arm64
  # The native capture helper (npm run build:native) → Contents/Resources/bin.
  # Added to the top-level extraResources (the addon), not replacing them.
  extraResources:
    - from: native/bin
      to: bin
      filter:
        - depleted-capture
  minimumSystemVersion: "13.0"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization needs the hardened runtime. Local builds re-signed by build/afterSign.js
  # don't get it, which is fine: they never leave this Mac.
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing: a "Developer ID Application" certificate (CSC_LINK / CSC_KEY_PASSWORD in the
  # release workflow, or found in the keychain) signs the app, and an App Store Connect
  # API key (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER) notarizes it. Without one, build/afterSign.js
  # signs with the stable local certificate from scripts/create-signing-cert.sh if it
  # exists (so Screen Recording permission survives rebuilds), else ad-hoc.
  extendInfo:
    # Required since macOS 10.15 for any app that captures the screen.
    NSScreenCaptureUsageDescription: >-
      Depleted captures the game window to record your Mythic+ keys.
      It only records in Mythic dungeons, or when you run a test recording.

# App icon: build/icon.icns, picked up from buildResources by default.
dmg:
  title: "${productName} ${version}"
  background: build/background.png   # background@2x.png next to it is used on Retina
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 170
    - x: 410
      y: 170
      type: link
      path: /Applications
