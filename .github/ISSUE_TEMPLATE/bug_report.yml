name: Bug report
description: Something isn't working, like recording, audio, the timeline, the Coach or the addon
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Details about your Mac and the key you ran are the most useful part.
        Please leave out your Warcraft Logs client secret and anything else private.

  - type: input
    id: app-version
    attributes:
      label: Depleted version
      description: From the DMG file name, or Get Info on Depleted.app in Finder
      placeholder: "1.0.19"
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: "MacBook Pro M3 Pro, macOS 15.1"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: What kind of problem is this?
      options:
        - A key wasn't recorded, or recording failed
        - The video is black, choppy or the wrong window
        - No audio, or an audio problem
        - Wrong timeline markers, outcome, timer or score
        - Coach notes look wrong
        - Warcraft Logs connection problem
        - Companion addon problem
        - Install, Gatekeeper or Screen Recording permission
        - UI bug
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead. Dungeon and key level help.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: logs
    attributes:
      label: Error text or console output
      description: >
        The exact text of any in-app error, or terminal output if you ran `npm run dev`.
        A short excerpt of the combat log around the problem also helps.
      render: shell
