name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    name: Lint and Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Prevents electron-builder from trying to sign the app in CI
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test
        run: npm test

      - name: Build native capture helper
        # Swift helper bundled into the app (native/DepletedCapture), arm64 + x86_64
        run: npm run build:native
        env:
          UNIVERSAL: '1'

      - name: Package smoke-test (directory, no signing)
        # Verifies electron-builder config and that the app can be assembled.
        # Uses --dir to skip DMG creation (faster) and --universal for the
        # fat-binary target defined in electron-builder.yml.
        run: npx electron-builder --mac --dir --universal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
