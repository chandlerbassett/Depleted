name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint and Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Prevents electron-builder from trying to sign the app in CI
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Test
        run: npm test

      - name: Build native capture helper
        # Swift helper bundled into the app (native/DepletedCapture), arm64
        run: npm run build:native

      - name: Package smoke-test (directory, no signing)
        # Verifies electron-builder config and that the app can be assembled.
        # Uses --dir to skip DMG creation (faster).
        # On failure, the tail of the log is also posted as an annotation so it shows on the PR.
        run: |
          set -o pipefail
          if ! npx electron-builder --mac --dir --arm64 2>&1 | tee "$RUNNER_TEMP/package.log"; then
            tail -n 40 "$RUNNER_TEMP/package.log" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed -e 's/^/::error title=Package smoke-test::/'
            echo
            exit 1
          fi
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
