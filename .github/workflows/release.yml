name: Release

on:
  push:
    tags:
      - 'v*'
  # A test build: signed and notarized like a release, kept as a download on the run
  # instead of being published
  workflow_dispatch:

# contents: create the release and upload the DMG. id-token + attestations: sign a
# build provenance attestation, so anyone can check the DMG was built here, from
# this repo's commit (gh attestation verify <dmg> -R chandlerbassett/Depleted).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS — Apple silicon DMG (arm64)
  # ---------------------------------------------------------------------------
  build-mac:
    name: macOS (arm64)
    runs-on: macos-latest

    steps:
      # Actions are pinned to commits; Dependabot keeps them current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag (releases)
        if: startsWith(github.ref, 'refs/tags/v')
        # A release must be a commit that's on main, and match package.json's version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME isn't on main"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Load the signing certificate
        # Into a temporary keychain the build finds by itself. electron-builder's own
        # CSC_LINK import fails on current macOS runners (set-key-partition-list can't
        # unlock its keychain), so it gets no CSC_LINK.
        env:
          P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::MAC_CERTIFICATE_P12_BASE64 is not set: the build will be ad-hoc signed"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Load notarization secrets
        # Only the ones that are set: an empty APPLE_ID still switches notarization on
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              echo "$name=${!name}" >> "$GITHUB_ENV"
              echo "$name: set"
            else
              echo "::warning::$name is not set"
            fi
          done

      - name: Build, sign & notarize
        # Signs with the Developer ID certificate and notarizes when the secrets are set
        # (see CONTRIBUTING.md). Without them the DMG is ad-hoc signed and not notarized.
        run: npm run build:mac -- --publish never

      - name: Check the signature
        run: |
          app="$(ls -d dist/mac-arm64/*.app)"
          codesign --verify --deep --strict --verbose=2 "$app"
          if ! spctl --assess --type execute --verbose=4 "$app"; then
            # Never publish a release Gatekeeper would block
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::Not notarized"; exit 1; fi
            echo "::warning::Not notarized: Gatekeeper will warn on first launch"
          fi

      - name: Keep the DMG on the run (test builds)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Depleted-test-build
          path: dist/*.dmg
          retention-days: 7

      - name: Checksum (releases)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance (releases)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg

      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
