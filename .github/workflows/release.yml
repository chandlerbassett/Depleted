name: Release

on:
  push:
    tags:
      - 'v*'
  # A test build: signed and notarized like a release, kept as a download on the run
  # instead of being published
  workflow_dispatch:

# Required to create GitHub releases and upload assets.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS — Apple silicon DMG (arm64)
  # ---------------------------------------------------------------------------
  build-mac:
    name: macOS (arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build, sign & notarize
        # Signs with the Developer ID certificate and notarizes when these secrets are set
        # (see CONTRIBUTING.md). Without them the DMG is ad-hoc signed and not notarized.
        run: npm run build:mac -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Check the signature
        run: |
          app="$(ls -d dist/mac-arm64/*.app)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app" || echo "::warning::Not notarized: Gatekeeper will warn on first launch"

      - name: Keep the DMG on the run (test builds)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: Depleted-test-build
          path: dist/*.dmg
          retention-days: 7

      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.dmg
